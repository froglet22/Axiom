<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, viewport-fit=cover" />
<title>AXIOM</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@500;700;900&family=Rajdhani:wght@400;500;600;700&family=Share+Tech+Mono&display=swap" rel="stylesheet">
<link rel="stylesheet" href="style.css">
</head>
<body>

<div class="scanlines" aria-hidden="true"></div>

<div class="app-shell">

  <!-- ============ SIDEBAR (desktop) / BOTTOM NAV (mobile) ============ -->
  <nav class="sidebar" id="sidebar">
    <div class="brand">
      <div class="brand-mark">
        <svg viewBox="0 0 40 40" class="brand-ring">
          <circle cx="20" cy="20" r="17" class="ring-outer"/>
          <circle cx="20" cy="20" r="11" class="ring-inner"/>
          <circle cx="20" cy="20" r="3" class="ring-core"/>
        </svg>
      </div>
      <div class="brand-text">
        <span class="brand-title">AXIOM</span>
        <span class="brand-sub">PHASE I</span>
      </div>
    </div>

    <ul class="nav-list" id="navList">
      <li class="nav-item active" data-section="home">
        <span class="nav-icon" data-icon="home"></span>
        <span class="nav-label">Home</span>
      </li>
      <li class="nav-item" data-section="memory">
        <span class="nav-icon" data-icon="memory"></span>
        <span class="nav-label">Memory</span>
      </li>
      <li class="nav-item" data-section="tasks">
        <span class="nav-icon" data-icon="tasks"></span>
        <span class="nav-label">Tasks</span>
      </li>
      <li class="nav-item" data-section="voice">
        <span class="nav-icon" data-icon="voice"></span>
        <span class="nav-label">Console</span>
      </li>
      <li class="nav-item" data-section="settings">
        <span class="nav-icon" data-icon="settings"></span>
        <span class="nav-label">Settings</span>
      </li>
    </ul>

    <div class="sidebar-status">
      <div class="status-row">
        <span class="status-dot" id="driveStatusDot"></span>
        <span class="status-text" id="driveStatusText">Drive: disconnected</span>
      </div>
      <div class="status-row">
        <span class="status-dot" id="micStatusDot"></span>
        <span class="status-text" id="micStatusText">Mic: idle</span>
      </div>
    </div>
  </nav>

  <!-- ============ MOBILE TOP BAR ============ -->
  <header class="mobile-bar">
    <span class="mobile-title">AXIOM</span>
    <span class="mic-pulse-mini" id="micPulseMini"></span>
  </header>

  <!-- ============ MAIN CONTENT ============ -->
  <main class="content">

    <!-- ---------- HOME ---------- -->
    <section class="view active" id="view-home">
      <div class="view-head">
        <h1 id="homeGreeting">Standing by.</h1>
        <p class="view-sub" id="homeDate">—</p>
      </div>

      <div class="hud-grid">
        <div class="hud-core glass-panel">
          <svg viewBox="0 0 300 300" class="core-svg" id="coreSvg">
            <circle cx="150" cy="150" r="130" class="core-ring core-ring-outer"/>
            <circle cx="150" cy="150" r="105" class="core-ring core-ring-mid"/>
            <circle cx="150" cy="150" r="80" class="core-ring core-ring-inner"/>
            <circle cx="150" cy="150" r="55" class="core-ring core-ring-pulse"/>
          </svg>
          <div class="core-label">
            <span class="core-state" id="coreState">SYSTEM READY</span>
            <span class="core-sub">Say "Axiom" to begin</span>
          </div>
        </div>

        <div class="hud-side">
          <div class="glass-panel stat-card">
            <span class="stat-label">Notes Logged</span>
            <span class="stat-value mono" id="statNotes">0</span>
          </div>
          <div class="glass-panel stat-card">
            <span class="stat-label">Open Tasks</span>
            <span class="stat-value mono" id="statTasks
